
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Nalu-09 | Menu Administration</title>

  <!-- GitHub Pages用のCSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- Google Fonts -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Shippori+Mincho:wght@400;500&family=Zen+Old+Mincho:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <!-- GitHub PagesからGASへの通信 -->
  <script src="./api.js"></script>

  <style>
    body {
      background: #F7F5F0 !important;
      color: #302A26 !important;
      font-family:
        "Shippori Mincho",
        "Hiragino Mincho ProN",
        serif;
    }

    .admin {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 20px 80px;
      text-align: left;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 34px;
    }

    .admin-header h1 {
      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
      font-size: clamp(34px, 7vw, 45px);
      font-weight: 400;
      margin: 14px 0;
    }

    .admin-description {
      font-size: 12px;
      line-height: 1.9;
      color: #746756;
    }

    .admin-card {
      background: #FFFFFF;
      border: 1px solid #DDD5C9;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .admin label {
      display: block;
      font-size: 13px;
      color: #453D35;
      margin-bottom: 12px;
    }

    .admin input,
    .admin select,
    .admin textarea {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px;
      background: #FFFFFF;
      color: #302A26;
      border: 1px solid #CCC3B6;
      border-radius: 8px;
      font-size: 15px;
      font-family:
        "Shippori Mincho",
        serif;
    }

    .admin textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .admin button {
      min-height: 44px;
      border: 1px solid #302A26;
      border-radius: 999px;
      background: #302A26;
      color: #FFFFFF;
      font-size: 13px;
      cursor: pointer;
      padding: 11px 20px;
    }

    .admin button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .admin .btn-secondary {
      background: transparent;
      color: #302A26;
    }

    .admin .btn-danger {
      background: transparent;
      color: #9D4B4B;
      border-color: #B98787;
    }

    .admin .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .admin-controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }

    .admin-row {
      background: #FFFFFF;
      border: 1px solid #DDD5C9;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
    }

    .admin-row .cols {
      display: grid;
      grid-template-columns: 80px 1fr 1fr;
      gap: 12px;
    }

    .admin-row-title {
      color: #A18D70;
      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
      font-size: 21px;
      margin-bottom: 18px;
    }

    .admin-message {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.8;
      margin-top: 18px;
      color: #746756;
    }

    .admin-message.error {
      color: #A83232;
    }

    .admin-message.success {
      color: #326645;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 640px) {
      .admin {
        padding: 24px 15px 60px;
      }

      .admin-card,
      .admin-row {
        padding: 16px;
      }

      .admin-row .cols {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .admin .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <main class="admin">

    <header class="admin-header">
      <div class="eyebrow">NALU — 09</div>

      <h1>Menu Administration</h1>

      <p class="admin-description">
        Nalu-09 会員制ブランド<br>
        コースメニュー管理
      </p>
    </header>

    <!-- 管理者認証 -->
    <section id="login" class="admin-card">

      <label for="key">
        管理用アクセスキー
      </label>

      <input
        id="key"
        type="password"
        autocomplete="off"
        placeholder="アクセスキーを入力"
      >

      <div class="actions">
        <button
          type="button"
          id="loginButton"
          onclick="loadMenuAdmin()"
        >
          管理画面を開く
        </button>
      </div>

    </section>

    <!-- メニュー管理 -->
    <section id="panel" hidden>

      <div class="admin-card">

        <div class="admin-controls">

          <label for="brand">
            ブランド名称

            <select
              id="brand"
              onchange="renderMenuAdmin()"
            ></select>
          </label>

        </div>

        <p class="admin-description">
          カテゴリーとNalu-09の名称は、
          Lumière Masterの設定から取得します。<br>
          「料理名を記載」を選択した場合、
          会員向け画面には料理名のみ表示します。
        </p>

        <div class="actions">

          <button
            type="button"
            class="btn-secondary"
            onclick="addMenuDish()"
          >
            ＋ 料理を追加
          </button>

          <button
            type="button"
            class="save-action"
            onclick="saveMenuAdmin()"
          >
            変更を保存する
          </button>

        </div>
      </div>

      <div id="rows"></div>

      <div class="actions">

        <button
          type="button"
          class="save-action"
          onclick="saveMenuAdmin()"
        >
          このブランドを保存
        </button>

      </div>

    </section>

    <p
      id="status"
      class="admin-message"
      role="status"
      aria-live="polite"
    ></p>

  </main>

  <script>
    "use strict";

    let menuAdminData = null;
    let menuAdminKey = "";
    let menuAdminBusy = false;

    const brandSelect =
      document.getElementById("brand");

    const rowsArea =
      document.getElementById("rows");

    const statusArea =
      document.getElementById("status");

    // --------------------------------------
    // メッセージ表示
    // --------------------------------------

    function menuAdminStatus(
      message,
      type = ""
    ) {
      statusArea.textContent =
        message || "";

      statusArea.className =
        "admin-message" +
        (type ? " " + type : "");
    }

    // --------------------------------------
    // 処理中の操作を防ぐ
    // --------------------------------------

    function setMenuAdminBusy(busy) {
      menuAdminBusy = busy;

      document.querySelectorAll(
        "button, #brand"
      ).forEach(element => {
        element.disabled = busy;
      });
    }

    // --------------------------------------
    // 管理画面データ取得
    // --------------------------------------

    async function loadMenuAdmin() {
      if (menuAdminBusy) return;

      const keyInput =
        document.getElementById("key");

      const key = keyInput.value.trim();

      if (!key) {
        menuAdminStatus(
          "管理用アクセスキーを入力してください。",
          "error"
        );
        return;
      }

      if (
        typeof NaluMenuAPI === "undefined"
      ) {
        menuAdminStatus(
          "api.jsを読み込めませんでした。",
          "error"
        );
        return;
      }

      setMenuAdminBusy(true);

      menuAdminStatus(
        "メニュー情報を読み込んでいます…"
      );

      try {
        // 第1引数は既存APIで管理認証に
        // 使用していないため空文字を渡す。
        // 実際の管理認証はGAS側で実施。
        const data =
          await NaluMenuAPI.getAdminData(
            "",
            key
          );

        if (
          !data ||
          !Array.isArray(data.brands) ||
          !Array.isArray(data.dishes)
        ) {
          throw new Error(
            "メニューデータの形式が不正です。"
          );
        }

        menuAdminData = data;
        menuAdminKey = key;

        keyInput.value = "";

        brandSelect.replaceChildren();

        for (const brand of data.brands) {
          const option =
            document.createElement("option");

          option.value = brand.name;
          option.textContent = brand.name;

          brandSelect.appendChild(option);
        }

        document.getElementById(
          "login"
        ).hidden = true;

        document.getElementById(
          "panel"
        ).hidden = false;

        renderMenuAdmin();

        menuAdminStatus("");

      } catch (error) {
        menuAdminStatus(
          "読み込みに失敗しました。\n" +
          (error.message || String(error)),
          "error"
        );

      } finally {
        setMenuAdminBusy(false);
      }
    }

    // --------------------------------------
    // プルダウン
    // --------------------------------------

    function makeMenuSelect(
      items,
      selectedValue
    ) {
      const select =
        document.createElement("select");

      const values = [
        ...new Set([
          "",
          ...(Array.isArray(items)
            ? items
            : []),
          selectedValue || ""
        ])
      ];

      for (const value of values) {
        const option =
          document.createElement("option");

        option.value = value;
        option.textContent =
          value || "選択してください";

        select.appendChild(option);
      }

      select.value =
        selectedValue || "";

      return select;
    }

    function makeMenuField(
      labelText,
      element
    ) {
      const label =
        document.createElement("label");

      label.append(
        document.createTextNode(labelText)
      );

      label.append(element);

      return label;
    }

    // --------------------------------------
    // ブランド別の料理表示
    // --------------------------------------

    function renderMenuAdmin() {
      if (!menuAdminData) return;

      rowsArea.replaceChildren();

      const selectedBrand =
        brandSelect.value;

      const dishes =
        menuAdminData.dishes
          .filter(
            dish =>
              dish.brand === selectedBrand
          )
          .sort(
            (a, b) =>
              Number(a.order) -
              Number(b.order)
          );

      dishes.forEach(
        dish => createMenuDishRow(dish)
      );

      renumberMenuDishes();

      if (!dishes.length) {
        menuAdminStatus(
          "このブランドにはまだ料理が登録されていません。"
        );
      } else {
        menuAdminStatus("");
      }
    }

    // --------------------------------------
    // 料理編集行
    // --------------------------------------

    function createMenuDishRow(data) {
      const box =
        document.createElement("section");

      box.className = "admin-row";

      const heading =
        document.createElement("div");

      heading.className =
        "admin-row-title";

      const cols =
        document.createElement("div");

      cols.className = "cols";

      // 表示順
      const order =
        document.createElement("input");

      order.type = "number";
      order.min = "1";
      order.className = "order";
      order.value = data.order || 1;

      // カテゴリー
      const category =
        makeMenuSelect(
          menuAdminData.options?.categories ||
            [],
          data.category || ""
        );

      category.className =
        "category-field";

      // Nalu-09名称
      const naluName =
        makeMenuSelect(
          menuAdminData.options?.naluNames ||
            [],
          data.naluName ||
            "料理名を記載"
        );

      naluName.className =
        "nalu-field";

      cols.append(
        makeMenuField(
          "表示順",
          order
        ),
        makeMenuField(
          "カテゴリー",
          category
        ),
        makeMenuField(
          "Nalu-09の名称",
          naluName
        )
      );

      // 料理名
      const dishName =
        document.createElement(
          "textarea"
        );

      dishName.className =
        "name-field";

      dishName.rows = 4;
      dishName.value = data.name || "";

      const actions =
        document.createElement("div");

      actions.className = "actions";

      // 上に移動
      const up =
        document.createElement("button");

      up.type = "button";
      up.className = "btn-secondary";
      up.textContent = "↑ 上へ";

      up.addEventListener(
        "click",
        () => {
          const prev =
            box.previousElementSibling;

          if (prev) {
            rowsArea.insertBefore(
              box,
              prev
            );
            renumberMenuDishes();
          }
        }
      );

      // 下に移動
      const down =
        document.createElement("button");

      down.type = "button";
      down.className = "btn-secondary";
      down.textContent = "↓ 下へ";

      down.addEventListener(
        "click",
        () => {
          const next =
            box.nextElementSibling;

          if (next) {
            rowsArea.insertBefore(
              next,
              box
            );
            renumberMenuDishes();
          }
        }
      );

      // 削除
      const remove =
        document.createElement("button");

      remove.type = "button";
      remove.className = "btn-danger";
      remove.textContent = "削除";

      remove.addEventListener(
        "click",
        () => {
          if (
            !confirm(
              "この料理を編集画面から削除しますか？\n保存するとシートにも反映されます。"
            )
          ) {
            return;
          }

          box.remove();
          renumberMenuDishes();
        }
      );

      actions.append(
        up,
        down,
        remove
      );

      box.append(
        heading,
        cols,
        makeMenuField(
          "料理名（改行対応）",
          dishName
        ),
        actions
      );

      rowsArea.append(box);

      renumberMenuDishes();
    }

    // --------------------------------------
    // 表示順更新
    // --------------------------------------

    function renumberMenuDishes() {
      rowsArea.querySelectorAll(
        ".admin-row"
      ).forEach((row, index) => {

        const order =
          row.querySelector(".order");

        const heading =
          row.querySelector(
            ".admin-row-title"
          );

        if (order) {
          order.value = index + 1;
        }

        if (heading) {
          heading.textContent =
            "Dish " +
            String(index + 1).padStart(
              2,
              "0"
            );
        }
      });
    }

    // --------------------------------------
    // 料理追加
    // --------------------------------------

    function addMenuDish() {
      if (!menuAdminData) return;

      createMenuDishRow({
        order:
          rowsArea.querySelectorAll(
            ".admin-row"
          ).length + 1,

        category: "",
        naluName: "料理名を記載",
        name: ""
      });

      renumberMenuDishes();
    }

    // --------------------------------------
    // 編集中の料理データを収集
    // --------------------------------------

    function collectMenuDishes() {
      return [
        ...rowsArea.querySelectorAll(
          ".admin-row"
        )
      ].map((row, index) => ({
        order: index + 1,

        category:
          row.querySelector(
            ".category-field"
          ).value,

        naluName:
          row.querySelector(
            ".nalu-field"
          ).value,

        name:
          row.querySelector(
            ".name-field"
          ).value
      }));
    }

    // --------------------------------------
    // 保存
    // --------------------------------------

    async function saveMenuAdmin() {
      if (
        menuAdminBusy ||
        !menuAdminData
      ) {
        return;
      }

      const brand =
        brandSelect.value;

      const dishes =
        collectMenuDishes();

      if (
        dishes.some(
          dish => !dish.name.trim()
        )
      ) {
        menuAdminStatus(
          "料理名が未入力の行があります。",
          "error"
        );
        return;
      }

      if (
        dishes.some(
          dish => !dish.category
        )
      ) {
        menuAdminStatus(
          "カテゴリーを選択してください。",
          "error"
        );
        return;
      }

      if (
        !confirm(
          brand +
          " の料理 " +
          dishes.length +
          " 件を保存します。\n\n現在の登録内容が更新されます。よろしいですか？"
        )
      ) {
        return;
      }

      setMenuAdminBusy(true);

      menuAdminStatus(
        "メニューを保存しています…"
      );

      try {
        const result =
          await NaluMenuAPI.saveBrandMenu(
            "",
            menuAdminKey,
            brand,
            dishes
          );

        // 保存後、最新データを再取得
        const updated =
          await NaluMenuAPI.getAdminData(
            "",
            menuAdminKey
          );

        menuAdminData = updated;
        brandSelect.value = brand;

        renderMenuAdmin();

        menuAdminStatus(
          (result.saved ?? dishes.length) +
          "件の料理を保存しました。",
          "success"
        );

      } catch (error) {
        menuAdminStatus(
          "保存できませんでした。\n" +
          (error.message || String(error)),
          "error"
        );

      } finally {
        setMenuAdminBusy(false);
      }
    }

    // --------------------------------------
    // Enterキーでもログイン
    // --------------------------------------

    document.getElementById(
      "key"
    ).addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          event.preventDefault();
          loadMenuAdmin();
        }
      }
    );

  </script>
</body>
</html>
